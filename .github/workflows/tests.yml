name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the pins in requirements.txt, minus the GPU-only torch/transformers
          grep -vE '^(#|torch|transformers|$)' requirements.txt > /tmp/req-ci.txt
          pip install pytest==9.2.0 -r /tmp/req-ci.txt
      - name: Claim audit (strict - every number bound to its sentence or cell)
        run: |
          python scripts/audit_claims.py --strict
      - name: Tests
        run: |
          export PYTHONPATH=src
          pytest tests/ -q
